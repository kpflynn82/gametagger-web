version: '3.8'

services:
  # Development: Backend only (frontend runs separately with npm run dev)
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=sqlite+aiosqlite:///./data/gametagger.db
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    volumes:
      - ./backend:/app
      - gametagger-data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Production: Full stack
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=sqlite+aiosqlite:///./data/gametagger.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      - gametagger-data:/app/data

volumes:
  gametagger-data:
